<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escrow Operator Dashboard</title>
<style>
:root { --bg: #0f0f14; --panel: #18181f; --border: #2a2a35; --text: #c8c8d0; --muted: #6b6b78; --accent: #7c5cfc; --green: #34d399; --red: #f87171; --amber: #fbbf24; --radius: 8px; }
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
.container { max-width: 1200px; margin: 0 auto; padding: 20px; }
header { display: flex; justify-content: space-between; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
header h1 { font-size: 1.3rem; font-weight: 600; }
header .wallet { display: flex; align-items: center; gap: 10px; }
.btn { padding: 8px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); color: var(--text); cursor: pointer; font-size: 0.85rem; transition: background 0.15s; }
.btn:hover { background: var(--border); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #6a4fe0; }
.btn-danger { background: var(--red); border-color: var(--red); color: #fff; font-size: 0.8rem; padding: 4px 12px; }
.btn-danger:hover { background: #e05b5b; }
.btn-sm { padding: 4px 10px; font-size: 0.78rem; }
.tabs { display: flex; gap: 4px; margin-bottom: 20px; }
.tab { padding: 6px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); color: var(--muted); cursor: pointer; font-size: 0.82rem; }
.tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
th { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
tbody tr { cursor: pointer; transition: background 0.1s; }
tbody tr:hover { background: var(--border); }
.state-badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.72rem; font-weight: 600; text-transform: uppercase; }
.state-FUNDED { background: #1a3a2a; color: var(--green); }
.state-SETTLED { background: #1a2a3a; color: #60a5fa; }
.state-DISPUTED { background: #3a2a1a; color: var(--amber); }
.state-CANCELLED { background: #3a1a1a; color: var(--red); }
.state-CREATED, .state-PENDING_FUNDING { background: #1f1f2a; color: var(--muted); }
.detail-panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-top: 20px; }
.detail-panel h2 { font-size: 1.1rem; margin-bottom: 16px; }
.field { display: flex; padding: 6px 0; border-bottom: 1px solid var(--border); }
.field:last-child { border-bottom: none; }
.field-label { width: 160px; color: var(--muted); font-size: 0.82rem; flex-shrink: 0; }
.field-value { font-family: monospace; font-size: 0.82rem; word-break: break-all; }
.field-value.pubkey { font-family: monospace; color: #a78bfa; }
.actions { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
.form-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-top: 12px; }
.form-card h3 { font-size: 0.95rem; margin-bottom: 12px; }
.form-group { margin-bottom: 12px; }
.form-group label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
.form-group select, .form-group textarea, .form-group input { width: 100%; padding: 8px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 0.82rem; font-family: system-ui, sans-serif; }
.form-group textarea { resize: vertical; min-height: 60px; }
.toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 20px; border-radius: var(--radius); font-size: 0.85rem; z-index: 100; border: 1px solid; }
.toast-ok { background: #1a3a2a; border-color: var(--green); color: var(--green); }
.toast-err { background: #3a1a1a; border-color: var(--red); color: var(--red); }
.hidden { display: none; }
.empty { text-align: center; padding: 40px; color: var(--muted); }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 6px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
code { background: #1f1f2a; padding: 1px 5px; border-radius: 3px; font-size: 0.8rem; }
</style>
</head>
<body>
<div class="container">
<header>
  <div>
    <h1>Escrow Operator Dashboard</h1>
    <div style="font-size:0.78rem;color:var(--muted);margin-top:2px">pontmore_escrow_http_v1 &middot; single_funder custodial</div>
  </div>
  <div class="wallet">
    <span id="wallet-status" style="font-size:0.8rem;color:var(--muted)">Wallet not connected</span>
    <button class="btn" id="connect-btn" onclick="connectWallet()">Connect Wallet</button>
    <button class="btn hidden" id="load-btn" onclick="loadEscrows()">Load Escrows</button>
  </div>
</header>

<div class="tabs" id="tabs">
  <div class="tab active" data-state="" onclick="setFilter('')">All</div>
  <div class="tab" data-state="CREATED" onclick="setFilter('CREATED')">Created</div>
  <div class="tab" data-state="PENDING_FUNDING" onclick="setFilter('PENDING_FUNDING')">Pending</div>
  <div class="tab" data-state="FUNDED" onclick="setFilter('FUNDED')">Funded</div>
  <div class="tab" data-state="DISPUTED" onclick="setFilter('DISPUTED')">Disputed</div>
  <div class="tab" data-state="SETTLED" onclick="setFilter('SETTLED')">Settled</div>
  <div class="tab" data-state="CANCELLED" onclick="setFilter('CANCELLED')">Cancelled</div>
</div>

<div id="table-area">
  <div class="empty" id="empty-state">Connect your wallet and click "Load Escrows" to list instances.</div>
  <table class="hidden" id="escrow-table">
    <thead><tr>
      <th>Escrow ID</th><th>State</th><th>Amount</th><th>Funder</th><th>Counterparty</th><th>Dispute</th><th>Updated</th>
    </tr></thead>
    <tbody id="escrow-rows"></tbody>
  </table>
</div>

<div id="detail-area"></div>

<div id="toast-container"></div>
</div>

<script>
const DR = '/pontmore/v1/operator';
const ES = '/pontmore/v1';

const DISPUTE_CLASSES = {
  payment_not_received: 'Payment Not Received',
  payment_amount_mismatch: 'Payment Amount Mismatch',
  payout_not_sent: 'Payout Not Sent',
  payout_amount_mismatch: 'Payout Amount Mismatch',
  escrow_funding_failure: 'Escrow Funding Failure',
  conflicting_external_confirmations: 'Conflicting Confirmations',
  fraud_or_impersonation_risk: 'Fraud / Impersonation',
  timeout_and_abandonment: 'Timeout / Abandonment',
};

const RESOLUTION_MODES = {
  confirm_customer_claim: 'Confirm Customer Claim',
  confirm_agent_claim: 'Confirm Agent Claim',
  split_outcome: 'Split Outcome',
  cancel_and_refund: 'Cancel and Refund',
  escalate_manual_review: 'Escalate to Manual Review',
};

let operatorPubkey = null;
let dataCache = [];
let activeFilter = '';

function toast(msg, ok) {
  const el = document.createElement('div');
  el.className = 'toast ' + (ok ? 'toast-ok' : 'toast-err');
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

async function sha256Hex(str) {
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}

async function connectWallet() {
  if (!window.nostr) { toast('No NIP-07 extension found (nos2x, Alby, etc.)', false); return; }
  try {
    operatorPubkey = await window.nostr.getPublicKey();
    document.getElementById('wallet-status').textContent = operatorPubkey.slice(0,10)+'...';
    document.getElementById('connect-btn').classList.add('hidden');
    document.getElementById('load-btn').classList.remove('hidden');
    document.getElementById('empty-state').textContent = 'Click "Load Escrows" to list instances.';
    toast('Wallet connected', true);
  } catch(e) { toast('Failed to get pubkey: '+e.message, false); }
}

async function signNip98Event(method, url, body) {
  const event = {
    kind: 27235,
    created_at: Math.floor(Date.now()/1000),
    tags: [['u', url], ['method', method.toUpperCase()]],
    content: '',
    pubkey: operatorPubkey,
  };
  if (body) {
    const payloadHash = await sha256Hex(typeof body === 'string' ? body : JSON.stringify(body));
    event.tags.push(['payload', payloadHash]);
  }
  const signed = await window.nostr.signEvent(event);
  return 'Nostr ' + btoa(JSON.stringify(signed));
}

async function operatorFetch(method, path, body) {
  if (!operatorPubkey) { toast('Connect wallet first', false); throw new Error('no wallet'); }
  const url = window.location.origin + path;
  const auth = await signNip98Event(method, url, body);
  const headers = { Authorization: auth, 'Content-Type': 'application/json' };
  const opts = { method, headers };
  if (body) opts.body = typeof body === 'string' ? body : JSON.stringify(body);
  const res = await fetch(url, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

async function loadEscrows() {
  if (!operatorPubkey) { toast('Connect wallet first', false); return; }
  document.getElementById('load-btn').innerHTML = '<span class="spinner"></span>Loading';
  try {
    let url = DR + '/escrows';
    if (activeFilter) url += '?state=' + activeFilter;
    dataCache = await operatorFetch('GET', url);
    renderTable(dataCache);
    document.getElementById('empty-state').classList.add('hidden');
    document.getElementById('escrow-table').classList.remove('hidden');
  } catch(e) { toast(e.message, false); }
  finally { document.getElementById('load-btn').textContent = 'Load Escrows'; }
}

function setFilter(state) {
  activeFilter = state;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.state === state));
  loadEscrows();
}

function fmtSats(s) { return (s/1000).toFixed(0)+'k'; }
function fmtDate(d) { return d ? new Date(d).toLocaleString() : '—'; }
function fmtPubkey(pk) { return pk ? pk.slice(0,8)+'…'+pk.slice(-4) : '—'; }
function renderLabel(obj, val) {
  for (const [k, v] of Object.entries(obj)) { if (k === val) return v; }
  return val;
}

function renderTable(rows) {
  const tbody = document.getElementById('escrow-rows');
  tbody.innerHTML = rows.length === 0
    ? '<tr><td colspan="7" class="empty" style="text-align:center">No escrow instances match this filter.</td></tr>'
    : rows.map(r => `<tr onclick="showDetail('${r.escrow_id}')">
        <td><code title="${r.escrow_id}">${r.escrow_id.slice(0,8)}…</code></td>
        <td><span class="state-badge state-${r.state}">${r.state}</span></td>
        <td>${fmtSats(r.amount_sats)}</td>
        <td><span class="field-value pubkey">${fmtPubkey(r.creator_pubkey)}</span></td>
        <td><span class="field-value pubkey">${fmtPubkey(r.counterparty_pubkey)}</span></td>
        <td>${r.dispute_class ? renderLabel(DISPUTE_CLASSES, r.dispute_class) : '—'}</td>
        <td>${fmtDate(r.updated_at)}</td>
      </tr>`).join('');
}

async function showDetail(escrowId) {
  if (!operatorPubkey) { toast('Connect wallet first', false); return; }
  try {
    const r = await operatorFetch('GET', DR + '/escrows/' + escrowId);
    const area = document.getElementById('detail-area');
    area.innerHTML = `
<div class="detail-panel">
<h2>Escrow ${r.escrow_id}</h2>

<div class="field"><div class="field-label">State</div><div class="field-value"><span class="state-badge state-${r.state}">${r.state}</span></div></div>
<div class="field"><div class="field-label">Funding Model</div><div class="field-value">${r.funding_model}</div></div>
<div class="field"><div class="field-label">Amount</div><div class="field-value">${r.amount_sats} sats (${(r.amount_sats/100000000).toFixed(2)} BTC)</div></div>
<div class="field"><div class="field-label">Platform Fee</div><div class="field-value">${r.platform_fee_sats} sats</div></div>
<div class="field"><div class="field-label">Creator (Funder)</div><div class="field-value pubkey">${r.creator_pubkey}</div></div>
<div class="field"><div class="field-label">Counterparty</div><div class="field-value pubkey">${r.counterparty_pubkey || '— (not joined)'}</div></div>
<div class="field"><div class="field-label">Description</div><div class="field-value">${r.description || '—'}</div></div>
<div class="field"><div class="field-label">Refund LN Address</div><div class="field-value">${r.refund_ln_address || '—'}</div></div>
<div class="field"><div class="field-label">Payout LN Address</div><div class="field-value">${r.payout_ln_address || '—'}</div></div>
<div class="field"><div class="field-label">Payout Successful</div><div class="field-value">${r.payout_successful ? '✅ Yes' : '❌ No'}</div></div>
<div class="field"><div class="field-label">Invitation Token</div><div class="field-value"><code>${r.invitation_token || '—'}</code></div></div>
<div class="field"><div class="field-label">Release Decision</div><div class="field-value">${r.release_decision_type || '—'}</div></div>
<div class="field"><div class="field-label">Created</div><div class="field-value">${fmtDate(r.created_at)}</div></div>
<div class="field"><div class="field-label">Updated</div><div class="field-value">${fmtDate(r.updated_at)}</div></div>
${r.dispute_class ? `
<div class="field"><div class="field-label">Dispute Class</div><div class="field-value">${renderLabel(DISPUTE_CLASSES, r.dispute_class)}</div></div>
<div class="field"><div class="field-label">Dispute Opened By</div><div class="field-value pubkey">${r.dispute_opened_by || '—'}</div></div>
<div class="field"><div class="field-label">Dispute Opened</div><div class="field-value">${fmtDate(r.dispute_opened_at)}</div></div>
<div class="field"><div class="field-label">Dispute Summary</div><div class="field-value">${r.dispute_summary || '—'}</div></div>
<div class="field"><div class="field-label">Resolution Mode</div><div class="field-value">${r.dispute_resolution_mode ? renderLabel(RESOLUTION_MODES, r.dispute_resolution_mode) : '—'}</div></div>
<div class="field"><div class="field-label">Resolution Note</div><div class="field-value">${r.dispute_resolution_note || '—'}</div></div>
<div class="field"><div class="field-label">Resolved At</div><div class="field-value">${fmtDate(r.dispute_resolved_at)}</div></div>
` : ''}

<div class="actions">
  ${r.state === 'FUNDED' ? `<button class="btn btn-danger" onclick="showDisputeForm('${r.escrow_id}')">File Dispute</button>` : ''}
  ${r.state === 'DISPUTED' && !r.dispute_resolved_at ? `<button class="btn btn-primary" onclick="showResolveForm('${r.escrow_id}')">Resolve Dispute</button>` : ''}
  <button class="btn" onclick="document.getElementById('detail-area').innerHTML=''; loadEscrows()">Close</button>
</div>
<div id="inline-form"></div>
</div>`;
    area.scrollIntoView({ behavior: 'smooth' });
  } catch(e) { toast(e.message, false); }
}

function showDisputeForm(escrowId) {
  const clsOpts = Object.entries(DISPUTE_CLASSES).map(([k,v]) => `<option value="${k}">${v}</option>`).join('');
  document.getElementById('inline-form').innerHTML = `
<div class="form-card"><h3>File Dispute</h3>
  <div class="form-group">
    <label>Dispute Class (PIP-03)</label>
    <select id="dc-class">${clsOpts}</select>
  </div>
  <div class="form-group">
    <label>Summary</label>
    <textarea id="dc-summary" placeholder="Describe the dispute..."></textarea>
  </div>
  <div class="actions">
    <button class="btn btn-primary btn-sm" onclick="fileDispute('${escrowId}')">Submit Dispute</button>
    <button class="btn btn-sm" onclick="document.getElementById('inline-form').innerHTML=''">Cancel</button>
  </div>
</div>`;
}

async function fileDispute(escrowId) {
  try {
    const body = {
      escrow_id: escrowId,
      dispute_class: document.getElementById('dc-class').value,
      summary: document.getElementById('dc-summary').value,
    };
    const r = await operatorFetch('POST', DR + '/disputes', body);
    toast('Dispute filed — state: ' + r.state, true);
    showDetail(escrowId);
  } catch(e) { toast(e.message, false); }
}

function showResolveForm(escrowId) {
  const modeOpts = Object.entries(RESOLUTION_MODES).map(([k,v]) => `<option value="${k}">${v}</option>`).join('');
  document.getElementById('inline-form').innerHTML = `
<div class="form-card"><h3>Resolve Dispute</h3>
  <div class="form-group">
    <label>Outcome</label>
    <select id="rs-outcome">
      <option value="release">Release funds to counterparty</option>
      <option value="refund">Refund to creator (funder)</option>
    </select>
  </div>
  <div class="form-group">
    <label>Resolution Mode (PIP-03)</label>
    <select id="rs-mode">${modeOpts}</select>
  </div>
  <div class="form-group">
    <label>Resolution Note</label>
    <textarea id="rs-note" placeholder="Operator note explaining the resolution..."></textarea>
  </div>
  <div class="actions">
    <button class="btn btn-primary btn-sm" onclick="resolveDispute('${escrowId}')">Resolve</button>
    <button class="btn btn-sm" onclick="document.getElementById('inline-form').innerHTML=''">Cancel</button>
  </div>
</div>`;
}

async function resolveDispute(escrowId) {
  try {
    const body = {
      outcome: document.getElementById('rs-outcome').value,
      resolution_mode: document.getElementById('rs-mode').value,
      note: document.getElementById('rs-note').value,
    };
    const r = await operatorFetch('POST', DR + '/disputes/' + escrowId + '/resolve', body);
    toast('Dispute resolved — state: ' + r.state, true);
    showDetail(escrowId);
  } catch(e) { toast(e.message, false); }
}
</script>
</body>
</html>
